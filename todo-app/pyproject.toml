[project]
name = "todo-app"
version = "0.1.0"
description = "Phase I In-Memory Python Console Todo App"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [
    {name = "GIAIC Student"}
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]
